<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#b45309"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>
  <!-- flange -->
  <ellipse cx="450" cy="170" rx="160" ry="36" fill="url(#steel)" stroke="#475569" stroke-width="3"/>
  <ellipse cx="450" cy="155" rx="160" ry="36" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <!-- bolts -->
  <circle cx="320" cy="155" r="10" fill="#94a3b8" stroke="#475569"/>
  <circle cx="580" cy="155" r="10" fill="#94a3b8" stroke="#475569"/>
  <circle cx="450" cy="128" r="10" fill="#94a3b8" stroke="#475569"/>
  <circle cx="450" cy="182" r="10" fill="#94a3b8" stroke="#475569"/>
  <!-- terminals -->
  <rect x="410" y="90" width="22" height="50" rx="4" fill="#334155"/>
  <rect x="468" y="90" width="22" height="50" rx="4" fill="#334155"/>
  <!-- U heating element -->
  <path d="M360 190 C360 520, 360 560, 450 560 C540 560, 540 520, 540 190"
        fill="none" stroke="url(#copper)" stroke-width="28" stroke-linecap="round"/>
  <path d="M360 190 C360 520, 360 560, 450 560 C540 560, 540 520, 540 190"
        fill="none" stroke="#fde68a" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <text x="450" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Resistencia 1500W</text>
  <text x="450" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Calefón / termo eléctrico</text>
</svg>
